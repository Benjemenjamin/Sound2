<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pose Recognition</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <script src="script.js" defer></script>
    <!-- <script src="GameStart.js"></script> -->
</head>

<body>
    <div class="Ödipus">
        <p id="fb"></p>
    </div>
    <div class="Ende1">
        <p id="Good"></p>
    </div>

    <div class="Ende2">
        <p id="Job"></p>
    </div>

    <div class="R">
        <p id="r"></p>
        <style>
            @keyframes blink {
                0% {
                    opacity: 1;
                }

                50% {
                    opacity: 0;
                }

                100% {
                    opacity: 1;
                }
            }

            .R {
                color: rgba(249, 0, 112, 0.98);
                animation: blink 1s infinite;
                text-shadow: 2cap;
            }
        </style>
    </div>

    <div class="U">
        <p id="u"></p>
        <style>
            @keyframes blink {
                0% {
                    opacity: 1;
                }

                50% {
                    opacity: 0;
                }

                100% {
                    opacity: 1;
                }
            }

            .U {
                color: rgba(238, 255, 0, 0.925);
                animation: blink 1s infinite;
            }
        </style>
    </div>


    <div class="S">
        <p id="s"></p>
        <style>
            @keyframes blink {
                0% {
                    opacity: 1;
                }

                50% {
                    opacity: 0;
                }

                100% {
                    opacity: 1;
                }
            }

            .S {
                color: rgba(47, 255, 0, 0.98);
                animation: blink 1s infinite;
            }
        </style>
    </div>

    <div class="H">
        <p id="h"></p>
        <style>
            @keyframes blink {
                0% {
                    opacity: 1;
                }

                50% {
                    opacity: 0;
                }

                100% {
                    opacity: 1;
                }
            }

            .H {
                color: rgba(0, 99, 248, 0.98);
                animation: blink 1s infinite;
            }
        </style>
    </div>

    <div class="punkte">
        <p id="points"></p>
    </div>

    <div class="Achtung">
        <p id="achtung"></p>
    </div>
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- <div class="container">
        <input type="text" id="poseName" placeholder="pose name">:
        <button id="addPoseButton" class="button"><b>add</b> pose sample</button>
    </div> -->


    <button id="startButton" class="startButton">START</button>


    <!-- <button id="pauseButton" class="pauseButton">PAUSE</button> -->

    <audio id="RickRoll">
        <source src="RickRollKurz.wav" type="audio/mpeg">
    </audio>

   


        <img id="pistoleL" style="position:absolute; left:500px; top:100px;">
        <img id="pistoleR" style="position:absolute; left:500px; top:100px;">
        <img id="SILL" style="position:absolute; left:500px; top:100px;">
        <img id="SILR" style="position:absolute; left:500px; top:100px;">
        <img id="IMG" style="position:absolute; left:500px; top:100px;">
        <img id="image" style="position:absolute; left:500px; top:100px;">


        <img src="BlaueSpirale.gif" style="position: absolute; top: 23%; left: 54%;">
        <img src="GelberStern.gif" style="position: absolute; top: 35%; left: 62%;">
        <img src="GrüneSterne.gif" style="position: absolute; top: 45%; left: 80%;">
        <img src="LilaBlume.gif" style="position: absolute; top: 20%; left: 83%;">





  


    <div class="neu">
        <!-- <button id="saveButton" class="button"><b>save</b> pose library</button> -->
        <label for="file-input" class="button"><b>load</b> pose library</label>
        <input type="file" id="file-input" name="file-input" accept=".json" />
    </div>
    <!-- Hauptmenü -->
    <div id="mainMenu" class="menuOverlay">
        <h1>POSE RECOGNITION</h1>

        <button onclick="startGame()">START</button>
        <button onclick="showLeaderboard()">LEADERBOARD</button>
    </div>


    <!-- Leaderboard-Menü -->
    <div id="leaderboardMenu" class="menuOverlay" style="display: none;">

        <h2>LEADERBOARD</h2>

        <div id="leaderboard">
            <button id="leaderBoardButtonH" class="leaderBoardButton">Highscore</button>
            <button id="leaderBoardButtonA" class="leaderBoardButton">Average score</button>
            <button id="leaderBoardButtonT" class="leaderBoardButton">Games played</button>
            <button id="leaderBoardButtonP" class="leaderBoardButton">Points earned</button>
            <h3 id="leaderboardTitle">Highscore</h3>

            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th id="scoreHeading">Score</th>
                    </tr>
                </thead>

                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>

        <button onclick="hideLeaderboard()">BACK</button>
    </div>
    <button onclick="hideLeaderboard()">MENU</button>
</body>



</div>

</html>
